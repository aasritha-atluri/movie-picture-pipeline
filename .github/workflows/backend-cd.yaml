name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --tag movie-picture-backend:${{ github.sha }} \
            starter/backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image for ECR
        run: |
          docker tag \
            movie-picture-backend:${{ github.sha }} \
            ${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }}

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update Kubernetes image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image \
            backend=${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }}

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          kustomize build . | kubectl apply -f -
          